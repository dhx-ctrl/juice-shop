name: Import Scans -> DefectDojo (CD)

on:
  workflow_run:
    workflows: ["DevSecOps - Security Scans (CI)"]
    types: [completed]

jobs:
  import-to-defectdojo:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    env:
      DOJO_URL: "http://localhost:8080"
      DOJO_PRODUCT_ID: "1"
      DOJO_ENGAGEMENT_ID: "1"
      SCAN_TYPE_SONAR: "SonarQube API Import"
      SCAN_TYPE_TRIVY: "Trivy Scan"
      SCAN_TYPE_ZAP: "ZAP Scan"

      # Folder created by CI (per-run)
      RUN_OUTPUT_DIR: "/tmp/devsecops-scans/${{ github.event.workflow_run.id }}"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Import scans via script
        shell: bash
        env:
          DOJO_TOKEN: ${{ secrets.DOJO_TOKEN }}
        run: |
          set -euo pipefail
          bash .github/scripts/import_scans.sh

      - name: Cleanup run folder
        if: always()
        shell: bash
        run: |
          rm -rf "$RUN_OUTPUT_DIR" || true
