name: Import Scans -> DefectDojo (CD)

on:
  # Triggered automatically after devsecops.yml completes
  workflow_run:
    workflows: ["DevSecOps - Security Scans (CI)"]
    types:
      - completed

jobs:
  import-to-defectdojo:
    runs-on: [self-hosted, linux, x64]
    # Only import if the scans workflow actually ran (even if some steps failed)
    if: ${{ github.event.workflow_run.conclusion != 'cancelled' }}

    env:
      DOJO_URL: "http://localhost:8080"
      DOJO_PRODUCT_ID: "1"
      DOJO_ENGAGEMENT: "CI-CD"
      SCAN_TYPE_SONAR: "SonarQube API import"
      SCAN_TYPE_TRIVY: "Trivy Scan"
      SCAN_TYPE_ZAP: "ZAP Scan"
      # Same local directory as CI
      SCAN_OUTPUT_DIR: "/tmp/devsecops-scans"

    steps:
      # ── Verify scan files exist locally ──
      - name: Check scan results exist
        run: |
          echo "=== Checking local scan results ==="
          ls -la "$SCAN_OUTPUT_DIR"/*.json
          for f in sonarqube_issues.json trivy.json zap.json; do
            if [ ! -s "$SCAN_OUTPUT_DIR/$f" ]; then
              echo "WARNING: $f is missing or empty"
            else
              echo "OK: $f ($(wc -c < "$SCAN_OUTPUT_DIR/$f") bytes)"
            fi
          done

      # ── Import into DefectDojo (all local) ──
      - name: Import SonarQube -> DefectDojo
        if: always()
        run: |
          [ -s "$SCAN_OUTPUT_DIR/sonarqube_issues.json" ] && \
          curl --fail-with-body -sS -X POST "${DOJO_URL}/api/v2/import-scan/" \
            -H "Authorization: Token ${{ secrets.DOJO_TOKEN }}" \
            -F "active=true" \
            -F "verified=false" \
            -F "scan_type=${SCAN_TYPE_SONAR}" \
            -F "minimum_severity=Info" \
            -F "product=${DOJO_PRODUCT_ID}" \
            -F "engagement_name=${DOJO_ENGAGEMENT}" \
            -F "file=@${SCAN_OUTPUT_DIR}/sonarqube_issues.json;type=application/json" | cat

      - name: Import Trivy -> DefectDojo
        if: always()
        run: |
          [ -s "$SCAN_OUTPUT_DIR/trivy.json" ] && \
          curl --fail-with-body -sS -X POST "${DOJO_URL}/api/v2/import-scan/" \
            -H "Authorization: Token ${{ secrets.DOJO_TOKEN }}" \
            -F "active=true" \
            -F "verified=false" \
            -F "scan_type=${SCAN_TYPE_TRIVY}" \
            -F "minimum_severity=Low" \
            -F "product=${DOJO_PRODUCT_ID}" \
            -F "engagement_name=${DOJO_ENGAGEMENT}" \
            -F "file=@${SCAN_OUTPUT_DIR}/trivy.json;type=application/json" | cat

      - name: Import ZAP -> DefectDojo
        if: always()
        run: |
          [ -s "$SCAN_OUTPUT_DIR/zap.json" ] && \
          curl --fail-with-body -sS -X POST "${DOJO_URL}/api/v2/import-scan/" \
            -H "Authorization: Token ${{ secrets.DOJO_TOKEN }}" \
            -F "active=true" \
            -F "verified=false" \
            -F "scan_type=${SCAN_TYPE_ZAP}" \
            -F "minimum_severity=Low" \
            -F "product=${DOJO_PRODUCT_ID}" \
            -F "engagement_name=${DOJO_ENGAGEMENT}" \
            -F "file=@${SCAN_OUTPUT_DIR}/zap.json;type=application/json" | cat

      # ── Cleanup ──
      - name: Cleanup scan files
        if: always()
        run: |
          echo "Cleaning up scan results..."
          rm -f "$SCAN_OUTPUT_DIR"/*.json
