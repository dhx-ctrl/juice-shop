name: Import Scans -> DefectDojo (CD)

on:
  workflow_run:
    workflows: ["DevSecOps - Security Scans (CI)"]
    types: [completed]

jobs:
  import-to-defectdojo:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    env:
      DOJO_URL: "http://localhost:8080"
      DOJO_PRODUCT_ID: "1"

      # Use engagement ID (recommended; stable)
      DOJO_ENGAGEMENT_ID: "1"

      # Exact scan types (must match DefectDojo dropdown)
      SCAN_TYPE_SONAR: "SonarQube API Import"
      SCAN_TYPE_TRIVY: "Trivy Scan"
      SCAN_TYPE_ZAP: "ZAP Scan"

      # Match the CI run folder
      RUN_OUTPUT_DIR: "/tmp/devsecops-scans/${{ github.event.workflow_run.id }}"

    steps:
      - name: Verify scan files exist
        shell: bash
        run: |
          set -euo pipefail
          echo "RUN_OUTPUT_DIR=$RUN_OUTPUT_DIR"
          ls -la "$RUN_OUTPUT_DIR"

          test -s "$RUN_OUTPUT_DIR/sonarqube_issues.json"
          test -s "$RUN_OUTPUT_DIR/trivy.json"
          test -s "$RUN_OUTPUT_DIR/zap.xml"

          echo "All required scan files exist."

      - name: Import SonarQube -> DefectDojo
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body -sS -X POST "${DOJO_URL}/api/v2/import-scan/" \
            -H "Authorization: Token ${{ secrets.DOJO_TOKEN }}" \
            -F "active=true" \
            -F "verified=false" \
            -F "scan_type=${SCAN_TYPE_SONAR}" \
            -F "minimum_severity=Info" \
            -F "product=${DOJO_PRODUCT_ID}" \
            -F "engagement=${DOJO_ENGAGEMENT_ID}" \
            -F "file=@${RUN_OUTPUT_DIR}/sonarqube_issues.json;type=application/json"

      - name: Import Trivy -> DefectDojo
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body -sS -X POST "${DOJO_URL}/api/v2/import-scan/" \
            -H "Authorization: Token ${{ secrets.DOJO_TOKEN }}" \
            -F "active=true" \
            -F "verified=false" \
            -F "scan_type=${SCAN_TYPE_TRIVY}" \
            -F "minimum_severity=Low" \
            -F "product=${DOJO_PRODUCT_ID}" \
            -F "engagement=${DOJO_ENGAGEMENT_ID}" \
            -F "file=@${RUN_OUTPUT_DIR}/trivy.json;type=application/json"

      - name: Import ZAP -> DefectDojo (XML)
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body -sS -X POST "${DOJO_URL}/api/v2/import-scan/" \
            -H "Authorization: Token ${{ secrets.DOJO_TOKEN }}" \
            -F "active=true" \
            -F "verified=false" \
            -F "scan_type=${SCAN_TYPE_ZAP}" \
            -F "minimum_severity=Low" \
            -F "product=${DOJO_PRODUCT_ID}" \
            -F "engagement=${DOJO_ENGAGEMENT_ID}" \
            -F "file=@${RUN_OUTPUT_DIR}/zap.xml;type=text/xml"

      - name: Cleanup run folder
        if: always()
        shell: bash
        run: |
          rm -rf "$RUN_OUTPUT_DIR" || true
