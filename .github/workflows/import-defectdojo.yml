name: Import Scans -> DefectDojo (CD)

on:
  workflow_run:
    workflows: ["DevSecOps - Security Scans (CI)"]
    types: [completed]

jobs:
  import-to-defectdojo:
    runs-on: [self-hosted, linux, x64]
    if: ${{ github.event.workflow_run.conclusion != 'cancelled' }}

    env:
      DOJO_URL: "http://localhost:8080"
      DOJO_PRODUCT_ID: "1"

      # IMPORTANT: match DefectDojo dropdown exactly
      SCAN_TYPE_SONAR: "SonarQube API Import"
      SCAN_TYPE_TRIVY: "Trivy Scan"
      SCAN_TYPE_ZAP: "ZAP Scan"

      SCAN_OUTPUT_DIR: "/tmp/devsecops-scans"

      # If you know engagement id (recommended):
      DOJO_ENGAGEMENT_ID: "1"
      # If you insist on name instead, keep:
      # DOJO_ENGAGEMENT_NAME: "CI-CD"

    steps:
      - name: Check scan results exist (fail if missing)
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Checking local scan results ==="
          ls -la "$SCAN_OUTPUT_DIR"
          for f in sonarqube_issues.json trivy.json zap.xml; do
            test -s "$SCAN_OUTPUT_DIR/$f" || (echo "ERROR: missing/empty $f" && exit 1)
            echo "OK: $f ($(wc -c < "$SCAN_OUTPUT_DIR/$f") bytes)"
          done

      - name: Import SonarQube -> DefectDojo
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body -sS -X POST "${DOJO_URL}/api/v2/import-scan/" \
            -H "Authorization: Token ${{ secrets.DOJO_TOKEN }}" \
            -F "active=true" \
            -F "verified=false" \
            -F "scan_type=${SCAN_TYPE_SONAR}" \
            -F "minimum_severity=Info" \
            -F "product=${DOJO_PRODUCT_ID}" \
            -F "engagement=${DOJO_ENGAGEMENT_ID}" \
            -F "file=@${SCAN_OUTPUT_DIR}/sonarqube_issues.json;type=application/json"

      - name: Import Trivy -> DefectDojo
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body -sS -X POST "${DOJO_URL}/api/v2/import-scan/" \
            -H "Authorization: Token ${{ secrets.DOJO_TOKEN }}" \
            -F "active=true" \
            -F "verified=false" \
            -F "scan_type=${SCAN_TYPE_TRIVY}" \
            -F "minimum_severity=Low" \
            -F "product=${DOJO_PRODUCT_ID}" \
            -F "engagement=${DOJO_ENGAGEMENT_ID}" \
            -F "file=@${SCAN_OUTPUT_DIR}/trivy.json;type=application/json"

      - name: Import ZAP -> DefectDojo
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body -sS -X POST "${DOJO_URL}/api/v2/import-scan/" \
            -H "Authorization: Token ${{ secrets.DOJO_TOKEN }}" \
            -F "active=true" \
            -F "verified=false" \
            -F "scan_type=${SCAN_TYPE_ZAP}" \
            -F "minimum_severity=Low" \
            -F "product=${DOJO_PRODUCT_ID}" \
            -F "engagement=${DOJO_ENGAGEMENT_ID}" \
            -F "file=@${SCAN_OUTPUT_DIR}/zap.xml;type=type=text/xml"

      - name: Cleanup scan files
        if: always()
        shell: bash
        run: |
          rm -f "$SCAN_OUTPUT_DIR"/*.json
