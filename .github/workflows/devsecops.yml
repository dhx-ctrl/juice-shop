name: DevSecOps - Security Scans (CI)

on:
  push:
    branches: ["master"]
  pull_request:
  workflow_dispatch:

jobs:
  security-scans:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 120

    env:
      SCAN_BASE_DIR: "/tmp/devsecops-scans"
      RUN_OUTPUT_DIR: "/tmp/devsecops-scans/${{ github.run_id }}"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Prepare output directory ──
      - name: Prepare scan output directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUN_OUTPUT_DIR"
          rm -f "$RUN_OUTPUT_DIR"/* || true
          echo "RUN_OUTPUT_DIR=$RUN_OUTPUT_DIR"

      # ── SAST: Semgrep (full scan) ──
      - name: Semgrep full scan -> semgrep.json
        shell: bash
        run: |
          set -euo pipefail
          docker pull returntocorp/semgrep:latest
          docker run --rm \
            -v "${{ github.workspace }}:/src:ro" \
            -v "$RUN_OUTPUT_DIR:/out" \
            returntocorp/semgrep:latest \
            semgrep scan \
              --config=auto \
              --config=p/ci \
              --config=p/security-audit \
              --json \
              --output /out/semgrep.json \
              /src

          test -s "$RUN_OUTPUT_DIR/semgrep.json"

      # ── SCA: Trivy (filesystem + image, full scan) ──
      - name: Trivy full scan (filesystem) -> trivy_fs.json
        shell: bash
        run: |
          set -euo pipefail
          docker pull ghcr.io/aquasecurity/trivy:0.69.3
          docker run --rm \
            -v "${{ github.workspace }}:/workspace:ro" \
            -v "$RUN_OUTPUT_DIR:/out" \
            ghcr.io/aquasecurity/trivy:0.69.3 \
            fs \
            --scanners vuln,misconfig,secret,license \
            --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
            --format json \
            --output /out/trivy_fs.json \
            /workspace

          test -s "$RUN_OUTPUT_DIR/trivy_fs.json"

      - name: Trivy full scan (image) -> trivy_image.json
        shell: bash
        run: |
          set -euo pipefail
          docker pull bkimminich/juice-shop
          docker pull ghcr.io/aquasecurity/trivy:0.69.3

          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$RUN_OUTPUT_DIR:/out" \
            ghcr.io/aquasecurity/trivy:0.69.3 \
            image \
            --scanners vuln,misconfig,secret \
            --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
            --format json \
            --output /out/trivy_image.json \
            bkimminich/juice-shop

          test -s "$RUN_OUTPUT_DIR/trivy_image.json"

      # ── DAST: ZAP ──
      - name: Create docker network
        shell: bash
        run: |
          set -euo pipefail
          docker network create zapnet || true

      - name: Start Juice Shop (Docker)
        shell: bash
        run: |
          set -euo pipefail
          docker pull bkimminich/juice-shop
          docker rm -f juice-shop || true
          docker run -d --name juice-shop --network zapnet -p 3000:3000 bkimminich/juice-shop

          for i in {1..60}; do
            if curl -sSf http://localhost:3000 >/dev/null; then
              echo "Juice Shop ready"
              break
            fi
            sleep 2
          done

      - name: ZAP baseline scan -> zap.xml
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUN_OUTPUT_DIR"

          # Use :stable — contains zap-baseline.py; :bare does NOT
          docker pull ghcr.io/zaproxy/zaproxy:stable
          docker run --rm --network zapnet -v ${{ github.workspace }}:/zap/wrk:rw \
            ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
            -t http://juice-shop:3000 \
            -x zap.xml \
            -r zap.html || true

          test -s zap.xml
          cp zap.xml "$RUN_OUTPUT_DIR/zap.xml"
          test -s "$RUN_OUTPUT_DIR/zap.xml"

      - name: Stop Juice Shop
        if: always()
        shell: bash
        run: |
          docker rm -f juice-shop || true

      # ── Verify all results ──
      - name: List scan results
        if: always()
        shell: bash
        run: |
          echo "=== Scan results in $RUN_OUTPUT_DIR ==="
          ls -la "$RUN_OUTPUT_DIR" || true

      # ── DEBUG: Inspect raw scan outputs ──
      # This step counts findings in each file and prints a preview.
      # Remove once findings counts in DefectDojo are confirmed correct.
      - name: "[DEBUG] Inspect scan outputs"
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================================"
          echo "DEBUG: semgrep.json"
          echo "======================================================"
          SEMGREP_RESULTS=$(python3 -c "
          import json, sys
          with open('$RUN_OUTPUT_DIR/semgrep.json') as f:
              d = json.load(f)
          results = d.get('results', [])
          errors  = d.get('errors', [])
          print(f'  findings : {len(results)}')
          print(f'  errors   : {len(errors)}')
          for i, r in enumerate(results[:5]):
              print(f'  [{i+1}] {r.get(\"check_id\",\"?\")} | {r.get(\"path\",\"?\")}:{r.get(\"start\",{}).get(\"line\",\"?\")} | severity={r.get(\"extra\",{}).get(\"severity\",\"?\")}')
          if len(results) > 5:
              print(f'  ... and {len(results)-5} more')
          " 2>&1) || SEMGREP_RESULTS="ERROR reading semgrep.json"
          echo "$SEMGREP_RESULTS"

          echo "======================================================"
          echo "DEBUG: trivy_fs.json"
          echo "======================================================"
          TRIVY_FS_RESULTS=$(python3 -c "
          import json, sys
          with open('$RUN_OUTPUT_DIR/trivy_fs.json') as f:
              d = json.load(f)
          results = d.get('Results', [])
          total = sum(len(r.get('Vulnerabilities') or []) + len(r.get('Misconfigurations') or []) + len(r.get('Secrets') or []) for r in results)
          print(f'  Result blocks : {len(results)}')
          print(f'  Total vulns/misconfigs/secrets: {total}')
          count = 0
          for r in results:
              for v in (r.get('Vulnerabilities') or [])[:3]:
                  print(f'  [vuln] {v.get(\"VulnerabilityID\",\"?\")} | {v.get(\"PkgName\",\"?\")} | {v.get(\"Severity\",\"?\")}')
                  count += 1
                  if count >= 5: break
              if count >= 5: break
          " 2>&1) || TRIVY_FS_RESULTS="ERROR reading trivy_fs.json"
          echo "$TRIVY_FS_RESULTS"

          echo "======================================================"
          echo "DEBUG: trivy_image.json"
          echo "======================================================"
          TRIVY_IMG_RESULTS=$(python3 -c "
          import json, sys
          with open('$RUN_OUTPUT_DIR/trivy_image.json') as f:
              d = json.load(f)
          results = d.get('Results', [])
          total = sum(len(r.get('Vulnerabilities') or []) + len(r.get('Misconfigurations') or []) for r in results)
          print(f'  Result blocks : {len(results)}')
          print(f'  Total vulns/misconfigs: {total}')
          count = 0
          for r in results:
              for v in (r.get('Vulnerabilities') or [])[:3]:
                  print(f'  [vuln] {v.get(\"VulnerabilityID\",\"?\")} | {v.get(\"PkgName\",\"?\")} | {v.get(\"Severity\",\"?\")}')
                  count += 1
                  if count >= 5: break
              if count >= 5: break
          " 2>&1) || TRIVY_IMG_RESULTS="ERROR reading trivy_image.json"
          echo "$TRIVY_IMG_RESULTS"

          echo "======================================================"
          echo "DEBUG: zap.xml"
          echo "======================================================"
          ZAP_RESULTS=$(python3 -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('$RUN_OUTPUT_DIR/zap.xml')
          root = tree.getroot()
          alerts = root.findall('.//alertitem')
          instances = root.findall('.//instance')
          print(f'  alert types  : {len(alerts)}')
          print(f'  instances    : {len(instances)}')
          for a in alerts[:5]:
              name     = a.findtext('alert', '?')
              risk     = a.findtext('riskdesc', '?')
              count_el = a.findtext('count', '?')
              print(f'  [{name}] risk={risk} count={count_el}')
          " 2>&1) || ZAP_RESULTS="ERROR reading zap.xml"
          echo "$ZAP_RESULTS"

          echo "======================================================"
          echo "DEBUG: DefectDojo version"
          echo "======================================================"
          curl -sS "${DOJO_URL:-http://localhost:8080}/api/v2/system_settings/" \
            -H "Authorization: Token ${DOJO_TOKEN:-}" \
            | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          r=d.get('results',[{}])
          print('  DD version info (system_settings):', json.dumps(r[0] if r else {}, indent=2)[:400])
          " 2>/dev/null || echo "  (could not reach DefectDojo or token not set in this step)"

      # Optional: keep artifacts in GitHub
      - name: Upload scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-scan-results-${{ github.run_id }}
          path: |
            /tmp/devsecops-scans/${{ github.run_id }}/*
