name: DevSecOps - Security Scans (CI)

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  security-scans:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 90

    env:
      SONAR_HOST_URL: "http://localhost:9000"
      SONAR_PROJECT_KEY: "juice-shop"

      SCAN_BASE_DIR: "/tmp/devsecops-scans"
      RUN_OUTPUT_DIR: "/tmp/devsecops-scans/${{ github.run_id }}"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Prepare output directory ──
      - name: Prepare scan output directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUN_OUTPUT_DIR"
          rm -f "$RUN_OUTPUT_DIR"/* || true
          echo "RUN_OUTPUT_DIR=$RUN_OUTPUT_DIR"

      # ── Ensure SonarQube is running ──
      - name: Ensure SonarQube is running
        shell: bash
        run: |
          set -euo pipefail

          if ! docker ps --format '{{.Names}}' | grep -q '^sonarqube$'; then
            docker rm -f sonarqube || true
            docker volume create sonarqube_data || true
            docker volume create sonarqube_extensions || true
            docker run -d --name sonarqube -p 9000:9000 \
              -v sonarqube_data:/opt/sonarqube/data \
              -v sonarqube_extensions:/opt/sonarqube/extensions \
              sonarqube:lts
          fi

          for i in {1..80}; do
            status="$(curl -sS "$SONAR_HOST_URL/api/system/health" | grep -o '"status":"[^"]*"' || true)"
            echo "SonarQube health: $status"
            echo "$status" | grep -q 'GREEN\|YELLOW' && break
            sleep 3
          done

      # ── Node setup ──
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        shell: bash
        run: |
          set -euo pipefail
          npm install

      # ── Install sonar-scanner (fixed PATH) ──
      - name: Install sonar-scanner (no sudo, fixed PATH)
        shell: bash
        run: |
          set -euo pipefail

          if ! ls -d /tmp/sonar-scanner-* >/dev/null 2>&1; then
            curl -sSLo /tmp/sonar-scanner.zip \
              https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-6.2.1.4610-linux-x64.zip
            unzip -oq /tmp/sonar-scanner.zip -d /tmp
          fi

          SCANNER_DIR="$(ls -d /tmp/sonar-scanner-* | head -n 1)"
          export PATH="$SCANNER_DIR/bin:$PATH"
          echo "$SCANNER_DIR/bin" >> "$GITHUB_PATH"

          sonar-scanner --version

      # ── SAST: SonarQube ──
      - name: SonarQube scan
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          sonar-scanner \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.login="$SONAR_TOKEN" \
            -Dsonar.projectKey="$SONAR_PROJECT_KEY" \
            -Dsonar.projectName="Juice Shop" \
            -Dsonar.sources="." \
            -Dsonar.exclusions="**/node_modules/**,**/dist/**,**/build/**"

      - name: Export SonarQube issues (API Import JSON)
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          curl -sS -u "$SONAR_TOKEN:" \
            "$SONAR_HOST_URL/api/issues/search?componentKeys=$SONAR_PROJECT_KEY&ps=500" \
            -o "$RUN_OUTPUT_DIR/sonarqube_issues.json"
          test -s "$RUN_OUTPUT_DIR/sonarqube_issues.json"

      # ── SCA: Trivy (ONE SINGLE FILE, IMAGE SCAN) ──
      - name: Trivy scan (image) -> trivy.json
        shell: bash
        run: |
          set -euo pipefail

          # Scan the Juice Shop image (usually much richer than filesystem scan)
          docker pull bkimminich/juice-shop
          docker pull aquasec/trivy:latest

          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$RUN_OUTPUT_DIR:/out" \
            aquasec/trivy:latest \
            image \
            --scanners vuln,misconfig,secret \
            --severity LOW,MEDIUM,HIGH,CRITICAL \
            --format json \
            --output /out/trivy.json \
            bkimminich/juice-shop

          test -s "$RUN_OUTPUT_DIR/trivy.json"

      # ── DAST: ZAP ──
      - name: Create docker network
        shell: bash
        run: |
          set -euo pipefail
          docker network create zapnet || true

      - name: Start Juice Shop (Docker)
        shell: bash
        run: |
          set -euo pipefail
          docker pull bkimminich/juice-shop
          docker rm -f juice-shop || true
          docker run -d --name juice-shop --network zapnet -p 3000:3000 bkimminich/juice-shop

          for i in {1..60}; do
            if curl -sSf http://localhost:3000 >/dev/null; then
              echo "Juice Shop ready"
              break
            fi
            sleep 2
          done

      # NOTE: Full scan = active scanning -> usually more findings
      - name: ZAP full scan -> zap.xml
        shell: bash
        run: |
          set -euo pipefail
          docker pull ghcr.io/zaproxy/zaproxy:stable
          docker run --rm --network zapnet -v ${{ github.workspace }}:/zap/wrk:rw \
            ghcr.io/zaproxy/zaproxy:stable zap-full-scan.py \
            -t http://juice-shop:3000 \
            -x zap.xml \
            -r zap.html || true

          test -s zap.xml
          cp zap.xml "$RUN_OUTPUT_DIR/zap.xml"
          test -s "$RUN_OUTPUT_DIR/zap.xml"

      - name: Stop Juice Shop
        if: always()
        shell: bash
        run: |
          docker rm -f juice-shop || true

      # ── Verify all results ──
      - name: List scan results
        if: always()
        shell: bash
        run: |
          echo "=== Scan results in $RUN_OUTPUT_DIR ==="
          ls -la "$RUN_OUTPUT_DIR" || true

      # Optional: keep artifacts in GitHub
      - name: Upload scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-scan-results-${{ github.run_id }}
          path: |
            /tmp/devsecops-scans/${{ github.run_id }}/*
