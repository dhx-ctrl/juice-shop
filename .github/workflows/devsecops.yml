name: DevSecOps - Security Scans (CI)

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  security-scans:
    runs-on: [self-hosted, linux, x64]

    env:
      SONAR_HOST_URL: "http://localhost:9000"
      SONAR_PROJECT_KEY: "juice-shop"
      # Local shared directory for scan results
      SCAN_OUTPUT_DIR: "/tmp/devsecops-scans"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Prepare output directory ──
      - name: Prepare scan output directory
        run: |
          mkdir -p "$SCAN_OUTPUT_DIR"
          rm -f "$SCAN_OUTPUT_DIR"/*.json

      # ── Ensure SonarQube is running ──
      - name: Ensure SonarQube is running
        run: |
          if ! docker ps --format '{{.Names}}' | grep -q '^sonarqube$'; then
            docker rm -f sonarqube || true
            docker volume create sonarqube_data || true
            docker volume create sonarqube_extensions || true
            docker run -d --name sonarqube -p 9000:9000 \
              -v sonarqube_data:/opt/sonarqube/data \
              -v sonarqube_extensions:/opt/sonarqube/extensions \
              sonarqube:lts
          fi

          echo "Waiting for SonarQube to be ready..."
          for i in {1..80}; do
            status="$(curl -sS "$SONAR_HOST_URL/api/system/status" | grep -o '"status":"[^"]*"' || true)"
            echo "SonarQube status: $status"
            echo "$status" | grep -q '"status":"UP"' && break
            sleep 3
          done

      # ── Node setup ──
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: npm install

      # ── Install sonar-scanner (no sudo, job-local) ──
      - name: Install sonar-scanner
        run: |
          if ! command -v sonar-scanner >/dev/null 2>&1; then
            curl -sSLo /tmp/sonar-scanner.zip https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-6.2.1.4610-linux-x64.zip
            unzip -oq /tmp/sonar-scanner.zip -d "$HOME/.sonar"
            SCANNER_DIR=$(ls -d "$HOME/.sonar/sonar-scanner-"* | head -1)
            echo "$SCANNER_DIR/bin" >> "$GITHUB_PATH"
          fi

      - name: Verify sonar-scanner
        run: sonar-scanner --version

      # ── SAST: SonarQube ──
      - name: SonarQube scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          sonar-scanner \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.login="$SONAR_TOKEN" \
            -Dsonar.projectKey="$SONAR_PROJECT_KEY" \
            -Dsonar.projectName="Juice Shop" \
            -Dsonar.sources="." \
            -Dsonar.exclusions="**/node_modules/**,**/dist/**,**/build/**"

      - name: Export SonarQube issues
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          curl -sS -u "$SONAR_TOKEN:" \
            "$SONAR_HOST_URL/api/issues/search?componentKeys=$SONAR_PROJECT_KEY&ps=500" \
            -o "$SCAN_OUTPUT_DIR/sonarqube_issues.json"
          test -s "$SCAN_OUTPUT_DIR/sonarqube_issues.json"

      # ── SCA: Trivy ──
      - name: Trivy scan -> trivy.json
        run: |
          docker pull aquasec/trivy:latest
          docker run --rm -v "${{ github.workspace }}:/repo" -w /repo aquasec/trivy:latest \
            fs --format json --output trivy.json .
          cp trivy.json "$SCAN_OUTPUT_DIR/trivy.json"
          test -s "$SCAN_OUTPUT_DIR/trivy.json"

      # ── DAST: ZAP ──
      - name: Create docker network
        run: docker network create zapnet || true

      - name: Start Juice Shop (Docker)
        run: |
          docker pull bkimminich/juice-shop
          docker rm -f juice-shop || true
          docker run -d --name juice-shop --network zapnet -p 3000:3000 bkimminich/juice-shop
          sleep 5
          for i in {1..60}; do
            if curl -sSf http://localhost:3000 >/dev/null 2>&1; then
              echo "Juice Shop ready after ~$((i * 3 + 5)) seconds"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "ERROR: Juice Shop did not start in time"
              docker logs juice-shop
              exit 1
            fi
            sleep 3
          done

      - name: ZAP baseline -> zap.json
        run: |
          docker pull ghcr.io/zaproxy/zaproxy:stable
          chmod 777 ${{ github.workspace }}
          docker run --rm --network zapnet \
            -v ${{ github.workspace }}:/zap/wrk:rw \
            ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
            -t http://juice-shop:3000 \
            -J zap.json \
            -r zap.html || true
          echo "=== Files in workspace after ZAP ==="
          ls -la ${{ github.workspace }}/zap.* || echo "No zap files found"
          cp ${{ github.workspace }}/zap.json "$SCAN_OUTPUT_DIR/zap.json"
          test -s "$SCAN_OUTPUT_DIR/zap.json"

      - name: Stop Juice Shop
        if: always()
        run: |
          docker rm -f juice-shop || true
          docker network rm zapnet || true

      # ── Verify all results ──
      - name: List scan results
        if: always()
        run: |
          echo "=== Scan results in $SCAN_OUTPUT_DIR ==="
          ls -la "$SCAN_OUTPUT_DIR"/*.json
