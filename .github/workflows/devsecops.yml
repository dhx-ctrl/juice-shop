name: DevSecOps - Security Scans (CI)

on:
  push:
    branches: ["master"]
  pull_request:
  workflow_dispatch:

jobs:
  security-scans:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 120

    env:
      SCAN_BASE_DIR: "/tmp/devsecops-scans"
      RUN_OUTPUT_DIR: "/tmp/devsecops-scans/${{ github.run_id }}"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Prepare output directory ──
      - name: Prepare scan output directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUN_OUTPUT_DIR"
          rm -f "$RUN_OUTPUT_DIR"/* || true
          echo "RUN_OUTPUT_DIR=$RUN_OUTPUT_DIR"

      # ── SAST: Semgrep (full scan) ──
      - name: Semgrep full scan -> semgrep.json
        shell: bash
        run: |
          set -euo pipefail
          docker pull returntocorp/semgrep:latest
          docker run --rm \
            -v "${{ github.workspace }}:/src:ro" \
            -v "$RUN_OUTPUT_DIR:/out" \
            returntocorp/semgrep:latest \
            semgrep scan \
              --config=auto \
              --config=p/ci \
              --config=p/security-audit \
              --json \
              --output /out/semgrep.json \
              /src

          test -s "$RUN_OUTPUT_DIR/semgrep.json"

      # ── SCA: Trivy (filesystem + image, full scan) ──
      - name: Trivy full scan (filesystem) -> trivy_fs.json
        shell: bash
        run: |
          set -euo pipefail
          docker pull ghcr.io/aquasecurity/trivy:0.69.3
          docker run --rm \
            -v "${{ github.workspace }}:/workspace:ro" \
            -v "$RUN_OUTPUT_DIR:/out" \
            ghcr.io/aquasecurity/trivy:0.69.3 \
            fs \
            --scanners vuln,misconfig,secret,license \
            --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
            --format json \
            --output /out/trivy_fs.json \
            /workspace

          test -s "$RUN_OUTPUT_DIR/trivy_fs.json"

      - name: Trivy full scan (image) -> trivy_image.json
        shell: bash
        run: |
          set -euo pipefail
          docker pull bkimminich/juice-shop
          docker pull ghcr.io/aquasecurity/trivy:0.69.3

          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$RUN_OUTPUT_DIR:/out" \
            ghcr.io/aquasecurity/trivy:0.69.3 \
            image \
            --scanners vuln,misconfig,secret \
            --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
            --format json \
            --output /out/trivy_image.json \
            bkimminich/juice-shop

          test -s "$RUN_OUTPUT_DIR/trivy_image.json"

      # ── DAST: ZAP ──
      - name: Create docker network
        shell: bash
        run: |
          set -euo pipefail
          docker network create zapnet || true

      - name: Start Juice Shop (Docker)
        shell: bash
        run: |
          set -euo pipefail
          docker pull bkimminich/juice-shop
          docker rm -f juice-shop || true
          docker run -d --name juice-shop --network zapnet -p 3000:3000 bkimminich/juice-shop

          for i in {1..60}; do
            if curl -sSf http://localhost:3000 >/dev/null; then
              echo "Juice Shop ready"
              break
            fi
            sleep 2
          done

      # NOTE: Full scan = active scanning -> usually more findings
      - name: ZAP full scan -> zap.xml
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network zapnet -v ${{ github.workspace }}:/zap/wrk:rw \
            ghcr.io/zaproxy/zaproxy@sha256:6a109ec5fedfe97037c5c4297de795a881523fb7dd30080577090e441199c2c9 \
            zap-full-scan.py \
            -t http://juice-shop:3000 \
            -x zap.xml \
            -r zap.html || true

          test -s zap.xml
          cp zap.xml "$RUN_OUTPUT_DIR/zap.xml"
          test -s "$RUN_OUTPUT_DIR/zap.xml"

      - name: Stop Juice Shop
        if: always()
        shell: bash
        run: |
          docker rm -f juice-shop || true

      # ── Verify all results ──
      - name: List scan results
        if: always()
        shell: bash
        run: |
          echo "=== Scan results in $RUN_OUTPUT_DIR ==="
          ls -la "$RUN_OUTPUT_DIR" || true

      # Optional: keep artifacts in GitHub
      - name: Upload scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-scan-results-${{ github.run_id }}
          path: |
            /tmp/devsecops-scans/${{ github.run_id }}/*
